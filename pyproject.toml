[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invest-helper"
version = "0.1.0"
description = "CLI assistant for analyzing a Russian MOEX portfolio with an OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
invest-helper = "invest_helper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/invest_helper"]
